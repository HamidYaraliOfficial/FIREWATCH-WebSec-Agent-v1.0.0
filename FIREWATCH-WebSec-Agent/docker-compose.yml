services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firewatch
      POSTGRES_USER: firewatch
      POSTGRES_PASSWORD: firewatch
    ports:
      - "5432:5432"
    volumes:
      - firewatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewatch -d firewatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://firewatch:firewatch@db:5432/firewatch
      ALLOW_PRIVATE_TARGETS: "false"
      MAX_PAGES: "100"
      MAX_DEPTH: "6"
      REQUEST_TIMEOUT_SECONDS: "15"
      REQUEST_DELAY_MS: "250"
      MAX_CONCURRENCY: "4"
      RESPECT_ROBOTS: "true"
      ENABLE_BROWSER: "false"
      ENABLE_ZAP: "false"
      REPORT_DIR: /data/reports
    volumes:
      - firewatch_reports:/data/reports
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://firewatch:firewatch@db:5432/firewatch
      ALLOW_PRIVATE_TARGETS: "false"
      MAX_PAGES: "100"
      MAX_DEPTH: "6"
      REQUEST_TIMEOUT_SECONDS: "15"
      REQUEST_DELAY_MS: "250"
      MAX_CONCURRENCY: "4"
      RESPECT_ROBOTS: "true"
      ENABLE_BROWSER: "false"
      ENABLE_ZAP: "false"
      REPORT_DIR: /data/reports
    volumes:
      - firewatch_reports:/data/reports
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["zap"]
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.disablekey=true"]
    ports:
      - "8080:8080"

volumes:
  firewatch_pg:
  firewatch_reports:
